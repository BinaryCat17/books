[project]
name = "layout"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "jsonschema>=4.23", "pymupdf>=1.24", "numpy>=1.26", "onnxruntime>=1.20", "opencv-python-headless>=4.9", "pyyaml>=6.0"]

[project.optional-dependencies]
docling = ["docling-slim==2.123.1", "rtree>=1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["layout"]

[tool.pytest.ini_options]
cache_dir = "../../.venv/pytest/layout"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: needs model weights"]
