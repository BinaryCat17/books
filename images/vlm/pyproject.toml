[project]
name = "vlm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vlm"]

[tool.pytest.ini_options]
cache_dir = "../../.venv/pytest/vlm"
testpaths = ["tests"]
pythonpath = ["tests"]
