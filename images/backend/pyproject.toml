[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
cache_dir = "../../.venv/pytest/backend"
testpaths = ["tests"]
pythonpath = ["tests"]
