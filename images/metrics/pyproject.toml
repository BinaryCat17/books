[project]
name = "metrics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.7", "uvicorn>=0.30", "pymupdf>=1.24", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metrics"]

[tool.pytest.ini_options]
cache_dir = "../../.venv/pytest/metrics"
testpaths = ["tests"]
pythonpath = ["tests"]
