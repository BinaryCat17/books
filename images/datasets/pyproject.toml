[project]
name = "datasets"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pymupdf>=1.24", "numpy>=1.26", "opencv-python-headless>=4.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datasets"]

[tool.pytest.ini_options]
cache_dir = "../../.venv/pytest/datasets"
testpaths = ["tests"]
pythonpath = ["tests"]
