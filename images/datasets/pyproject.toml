[project]
name = "datasets"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pymupdf>=1.24", "numpy>=1.26", "jsonschema>=4.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["datasets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: needs model weights"]
