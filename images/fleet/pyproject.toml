[project]
name = "fleet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.7", "uvicorn>=0.30", "httpx>=0.27", "vastai>=1.5.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleet"]

[tool.pytest.ini_options]
cache_dir = "../../.venv/pytest/fleet"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not vast'"
markers = ["docker: needs a docker daemon", "vast: needs a vast account and asks it"]
