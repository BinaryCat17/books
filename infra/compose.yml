name: booksmith
services:
  backend:
    build: {context: .., dockerfile: images/backend/Dockerfile}
    environment: {BOOKSMITH_METRICS: http://metrics:8000, BOOKSMITH_FLEET: http://fleet:8000, BOOKSMITH_ADMIN: "${BOOKSMITH_ADMIN:-}", FLEET_KEY: "${FLEET_KEY:-}"}
    volumes: [data:/data]
    depends_on: [metrics, fleet]
  metrics:
    build: {context: .., dockerfile: images/metrics/Dockerfile}
    volumes: [data:/data]
  fleet:
    build: {context: .., dockerfile: images/fleet/Dockerfile}
    environment: {FLEET_DOCKER_NETWORK: booksmith_default, FLEET_KEY: "${FLEET_KEY:-}", VAST_API_KEY: "${VAST_API_KEY:-}"}
    volumes: [data:/data, /var/run/docker.sock:/var/run/docker.sock]
  layout:
    image: booksmith/layout-pp-doclayoutv2
    build:
      context: ..
      dockerfile: images/layout/Dockerfile
      args: {MODEL_REPO: PaddlePaddle/PP-DocLayoutV2_onnx, MODEL_DIR: PP-DocLayoutV2_onnx, LAYOUT_ADAPTER: doclayout, LAYOUT_MODEL_NAME: PP-DocLayoutV2}
    profiles: [models]
  vlm:
    image: booksmith/vlm-paddleocr-vl
    build: {context: .., dockerfile: images/vlm/Dockerfile}
    profiles: [models]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: all, capabilities: [gpu]}]}}}
  datasets:
    build: {context: .., dockerfile: images/datasets/Dockerfile}
    profiles: [tools]
    volumes: [data:/data]
  proxy:
    build: {context: .., dockerfile: images/ui/Dockerfile}
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  data: {}
