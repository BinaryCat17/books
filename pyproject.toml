[project]
name = "booksmith"
version = "0.2.0"
description = "Сканы технических книг -> HTML, локально и на арендованных GPU"
requires-python = ">=3.10"
dependencies = [
    # pymupdf — растр страницы и разрез разворотов (djvu.py).
    # vastai — единственный клиент аренды (remote/vast.py).
    # requests и pillow сняты: приехали с движками Mistral и pdf_layer,
    # после их удаления не импортируются нигде; HTTP в живом коде идёт
    # через urllib из стандартной поставки.
    "pymupdf>=1.24",
    "vastai>=1.5.5",
]

# Детекция макета местно, на процессоре: `books detect`.  Отдельным набором,
# а не в основных зависимостях, потому что аренде и `books prepare` они не
# нужны, а onnxruntime с opencv весят под полгигабайта.
#   pip install -e ".[detect]"
[project.optional-dependencies]
detect = [
    "onnxruntime>=1.20",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyyaml>=6.0",
]

[project.scripts]
books = "booksmith.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
