[project]
name = "booksmith"
version = "0.3.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["images/backend", "images/metrics", "images/layout", "images/vlm", "images/datasets", "images/fleet"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.16", "httpx>=0.27", "jsonschema>=4.23", "pymupdf>=1.24"]

[tool.ruff]
cache-dir = ".venv/ruff"
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E9", "F", "UP", "B"]
ignore = ["E741", "E731", "B904", "B905"]
