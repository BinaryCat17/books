[project]
name = "booksmith"
version = "0.2.0"
description = "Сканы технических книг -> HTML, локально и на арендованных GPU"
requires-python = ">=3.10"
dependencies = [
    # pymupdf — растр страницы и разрез разворотов (djvu.py).
    # vastai — единственный клиент аренды (remote/vast.py).
    # requests и pillow сняты: приехали с движками Mistral и pdf_layer,
    # после их удаления не импортируются нигде; HTTP в живом коде идёт
    # через urllib из стандартной поставки.
    "pymupdf>=1.24",
    "vastai>=1.5.5",
]

# Детекция макета местно, на процессоре: `books detect`.  Отдельным набором,
# а не в основных зависимостях, потому что аренде и `books prepare` они не
# нужны, а onnxruntime с opencv весят под полгигабайта.
#   pip install -e ".[detect]"
[project.optional-dependencies]
detect = [
    "onnxruntime>=1.20",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyyaml>=6.0",
]

# Вендорский конвейер docling поверх рамок heron и egret — ручка
# `DOCLING_PIPELINE`.  Отдельным набором по той же причине, что и detect:
# без ручки адаптер обязан считать и БЕЗ этого пакета, а с ручкой и без
# пакета — падать вслух и называть вот эту строку установки.
#   pip install -e ".[docling]"     # или: uv pip install "docling-slim==..." rtree
# ЦЕНА ЧИСЛОМ: 25 колёс, +54 МБ к окружению (510 -> 570 МБ, замерено du -sb:
# 515238976 -> 571366772 байт). Torch среди них
# нет — потому и `docling-slim`, а не `docling`: полная поставка тянет движки
# разбора (torch, transformers, easyocr) на несколько гигабайт, а нам нужны
# ровно два файла чистого питона над рамками:
# `docling/utils/layout_postprocessor.py` и
# `docling/models/postprocessing/reading_order_rb.py`.
# `rtree` не украшение и не транзитивная зависимость: постобработчик строит по
# рамкам R-дерево (`docling/datamodel/spatial.py`), и без этого колеса импорт
# `layout_postprocessor` падает на первой же странице.
# Версия ЗАКОЛОЧЕНА точкой, а не диапазоном: оба файла — это правила, и правка
# правила у вендора молча сменила бы наши рамки и наш порядок. Разойдётся
# версия — разойдётся и sha256 обоих файлов в отпечатке, но заметить это можно
# будет только задним числом, а закол ловит заранее.
docling = [
    "docling-slim==2.123.1",
    "rtree>=1.3",
]

[project.scripts]
books = "booksmith.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
