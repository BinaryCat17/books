name: mirror upstream image

# Перекладка официального образа Baidu в GHCR. Раньше ради этого арендовался
# инстанс со skopeo — из Пекина образ шёл 8-14 минут и срывался в ретраи.
# Это работа для CI: реестр-в-реестр, через домашний канал ничего не идёт.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "образ у Baidu"
        default: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:latest-nvidia-gpu-offline
      target_tag:
        description: "тег в ghcr.io/<владелец>/paddleocr-vl"
        default: offline

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

      - name: копирование реестр-в-реестр
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | skopeo login ghcr.io -u ${{ github.actor }} --password-stdin
          OWNER=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          DST="ghcr.io/$OWNER/paddleocr-vl:${{ inputs.target_tag }}"
          echo "$DST"
          time skopeo copy --all --retry-times 5 \
            "docker://${{ inputs.source }}" "docker://$DST"

      # Не забыть один раз сделать пакет публичным, иначе vast не скачает его
      # без авторизации: github.com/users/<логин>/packages -> пакет ->
      # Package settings -> Change visibility -> Public
      - name: напоминание
        run: echo "Если пакет новый — сделай его публичным в настройках пакета."
