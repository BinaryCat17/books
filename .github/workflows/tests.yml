name: tests
on: [push, pull_request]
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix: {image: [backend, metrics, layout, vlm, datasets, fleet]}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --group dev --frozen
      - run: uv run ruff check images/${{ matrix.image }}
      - run: cd images/${{ matrix.image }} && uv run pytest -q
