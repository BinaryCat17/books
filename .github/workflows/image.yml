name: build ocr image

# Собираем в Actions, а не на арендованной машине: канал у раннера быстрый,
# а место под сборку бесплатное. Раньше для перекладки образа арендовался
# инстанс со skopeo — это была работа для CI.

on:
  workflow_dispatch:
    inputs:
      layout_engine:
        description: "движок детекции макета: onnx (~6 ГБ, выход совпадает точно) или paddle-gpu (~9 ГБ, запасной)"
        default: onnx
        type: choice
        options: [onnx, paddle-gpu]
      tag:
        description: "тег образа"
        default: latest
      bake_weights:
        description: "вшить веса в образ"
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ghcr.io не принимает заглавные буквы в имени репозитория, а логин на
      # GitHub может быть в любом регистре. Приводим здесь, один раз.
      - name: имя образа
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          echo "ref=ghcr.io/$OWNER/paddleocr-vl-vllm:${{ inputs.tag }}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: параметры движка детекции
        id: paddle
        run: |
          if [ "${{ inputs.layout_engine }}" = "paddle-gpu" ]; then
            # Запасной путь: детекция на paddle-GPU. Тянет 3.69 ГБ и сводит в
            # одном контейнере cu126 с cu13 — брать только если ORT подведёт.
            echo "pkg=paddlepaddle-gpu==3.2.1" >> $GITHUB_OUTPUT
            echo "index=https://www.paddlepaddle.org.cn/packages/stable/cu126/" >> $GITHUB_OUTPUT
            echo "ort=" >> $GITHUB_OUTPUT
            echo "layout=PaddlePaddle/PP-DocLayoutV2" >> $GITHUB_OUTPUT
          else
            echo "pkg=paddlepaddle==3.3.1" >> $GITHUB_OUTPUT
            echo "index=" >> $GITHUB_OUTPUT
            echo "ort=onnxruntime-gpu==1.29.0" >> $GITHUB_OUTPUT
            echo "layout=PaddlePaddle/PP-DocLayoutV2_onnx" >> $GITHUB_OUTPUT
          fi

      - uses: docker/build-push-action@v6
        with:
          context: infra/image
          push: true
          tags: ${{ steps.img.outputs.ref }}
          build-args: |
            PADDLE_PKG=${{ steps.paddle.outputs.pkg }}
            PADDLE_INDEX=${{ steps.paddle.outputs.index }}
            ORT_PKG=${{ steps.paddle.outputs.ort }}
            LAYOUT_MODEL=${{ steps.paddle.outputs.layout }}
            BAKE_WEIGHTS=${{ inputs.bake_weights && '1' || '0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Раскладка слоёв — единственный рычаг на скорость выкачивания, который у
      # нас вообще есть: демоном docker на арендованном хосте мы не управляем.
      # Поэтому она печатается в лог сборки, чтобы регресс был заметен сразу.
      - name: раскладка слоёв
        run: |
          IMG=${{ steps.img.outputs.ref }}
          docker buildx imagetools inspect "$IMG" --raw > /tmp/m.json || true
          python3 - <<'PY'
          import json
          try:
              m = json.load(open('/tmp/m.json'))
          except Exception as e:
              print('манифест не прочитан:', e); raise SystemExit(0)
          ls = m.get('layers') or []
          if not ls:
              print('слоёв в манифесте нет (индекс, а не манифест?)'); raise SystemExit(0)
          tot = sum(l['size'] for l in ls)
          print(f"{len(ls)} слоёв, всего {tot/2**30:.2f} ГБ")
          for l in sorted(ls, key=lambda x: -x['size']):
              print(f"  {l['size']/2**30:6.2f} ГБ  {100*l['size']/tot:5.1f}%")
          # Порог не произвольный: docker тянет три слоя параллельно, но внутри
          # слоя — один поток. Пока крупнейший слой больше трети объёма, он и
          # есть узкое место, и дробить остальное бесполезно.
          big = max(l['size'] for l in ls) / tot
          print(f"крупнейший слой: {100*big:.1f}% объёма, порог 33.3%"
                + ("  <-- ПЛОХО, он и будет узким местом" if big > 1/3 else "  ок"))
          PY
