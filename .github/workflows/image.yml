name: build ocr image

# Собираем в Actions, а не на арендованной машине: канал у раннера быстрый,
# а место под сборку бесплатное. Раньше для перекладки образа арендовался
# инстанс со skopeo — это была работа для CI.

on:
  workflow_dispatch:
    inputs:
      paddle:
        description: "paddle: gpu (~9 ГБ, нужен для детекции макета) или cpu (~5 ГБ, детекция 7.6 с/стр — не брать)"
        default: gpu
        type: choice
        options: [gpu, cpu]
      tag:
        description: "тег образа"
        default: latest
      bake_weights:
        description: "вшить веса в образ"
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/paddleocr-vl-vllm

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # У раннера свободно около 14 ГБ, а образ в распакованном виде заметно
      # больше. Без этой уборки сборка падает на "no space left on device".
      - name: освободить место
        run: |
          echo "до:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af
          echo "после:"; df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: параметры paddle
        id: paddle
        run: |
          if [ "${{ inputs.paddle }}" = "gpu" ]; then
            echo "pkg=paddlepaddle-gpu==3.2.1" >> $GITHUB_OUTPUT
            echo "index=https://www.paddlepaddle.org.cn/packages/stable/cu126/" >> $GITHUB_OUTPUT
          else
            echo "pkg=paddlepaddle==3.3.1" >> $GITHUB_OUTPUT
            echo "index=" >> $GITHUB_OUTPUT
          fi

      - uses: docker/build-push-action@v6
        with:
          context: infra/image
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ inputs.tag }}
          build-args: |
            TORCH_VERSION=2.13.0
            PADDLE_PKG=${{ steps.paddle.outputs.pkg }}
            PADDLE_INDEX=${{ steps.paddle.outputs.index }}
            BAKE_WEIGHTS=${{ inputs.bake_weights && '1' || '0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Раскладка слоёв — единственный рычаг на скорость выкачивания, который у
      # нас вообще есть: демоном docker на арендованном хосте мы не управляем.
      # Поэтому она печатается в лог сборки, чтобы регресс был заметен сразу.
      - name: раскладка слоёв
        run: |
          IMG=${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ inputs.tag }}
          docker buildx imagetools inspect "$IMG" --raw > /tmp/m.json || true
          python3 - <<'PY'
          import json
          try:
              m = json.load(open('/tmp/m.json'))
          except Exception as e:
              print('манифест не прочитан:', e); raise SystemExit(0)
          ls = m.get('layers') or []
          if not ls:
              print('слоёв в манифесте нет (индекс, а не манифест?)'); raise SystemExit(0)
          tot = sum(l['size'] for l in ls)
          print(f"{len(ls)} слоёв, всего {tot/2**30:.2f} ГБ")
          for l in sorted(ls, key=lambda x: -x['size']):
              print(f"  {l['size']/2**30:6.2f} ГБ  {100*l['size']/tot:5.1f}%")
          big = max(l['size'] for l in ls) / tot
          print(f"крупнейший слой: {100*big:.1f}% объёма"
                + ("  <-- ПЛОХО, тянуть будет в один поток" if big > 0.35 else "  ок"))
          PY
