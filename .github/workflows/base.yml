name: build base image

# The hallway image: sshd and nothing else. It changes almost never, so it is
# built apart from the payload -- and for the same reason it is already in the
# docker cache on most vast machines by the time we rent one.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "image tag; defaults to the short commit SHA"
        default: ""

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The tag must change with every build: vast extends our image with an
      # ssh layer of its own and caches the result on the machine as
      # <image>/ssh. With `latest` unchanged, the machine keeps the extension
      # built over the OLD base, and edits to the image simply never arrive.
      - name: image name
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG=$(git rev-parse --short HEAD)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "ref=ghcr.io/$OWNER/vast-base:$TAG" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: infra/base
          push: true
          tags: ${{ steps.img.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # The point of this image is to be small. If it ever swells, that must
      # show in the build log, not on a rented machine.
      - name: size
        run: |
          IMG=${{ steps.img.outputs.ref }}
          docker buildx imagetools inspect "$IMG" --raw > /tmp/m.json
          python3 - <<'PY'
          import json
          m = json.load(open('/tmp/m.json'))
          ls = m['layers']
          tot = sum(l['size'] for l in ls)
          for l in ls:
              print(f"  {l['size']/2**20:7.1f} MB")
          print(f"{len(ls)} layers, {tot/2**20:.0f} MB in all")
          # Three streams at ~25 Mbit/s = 76 Mbit/s; 150 MB take ~16 s.
          print(f"pull on vast ~{tot*8/2**20/76:.0f} s")
          # The threshold has slack: gcc with the libc headers is already close
          # to a hundred megabytes, and it will not shrink while triton
          # compiles its own kernels.
          assert tot < 250*2**20, "the hallway swelled -- something got in"
          PY

      - name: what to put in the job
        run: |
          echo "BASE_IMAGE = \"${{ steps.img.outputs.ref }}\""
          echo "  (src/booksmith/models/paddleocr_vl/__init__.py)"
